name: Mobile release

# Called by ci.yml after a green main push that changed mobile/ (only when the
# repo variable MOBILE_RELEASE_ENABLED is "true"), or started by hand from the
# Actions tab. The decision logic is in scripts/ci/mobile-release.sh (tests:
# scripts/ci/mobile-release.test.sh); owner docs in mobile/docs/OTA.md.
# Only a dry run may start from a branch other than main.
on:
  workflow_call:
    inputs:
      platform:
        type: string
        default: all
      force_build:
        type: boolean
        default: false
      dry_run:
        type: boolean
        default: false
    secrets:
      EXPO_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      platform:
        description: Platform
        type: choice
        options: [all, ios, android]
        default: all
      force_build:
        description: Build even if the native fingerprint did not change
        type: boolean
        default: false
      dry_run:
        description: Only print the decision (no OTA, build or tag)
        type: boolean
        default: true

concurrency:
  group: mobile-release
  cancel-in-progress: false

permissions:
  contents: write # pushes the ios-build-* tag

jobs:
  release:
    if: github.ref == 'refs/heads/main' || inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
      # EXPO_PUBLIC_APP_ENV, EXPO_PUBLIC_API_MODE and the native sign-in
      # switches come from mobile/release.env (the script exports them), the
      # same file Xcode Cloud reads, so the iOS fingerprint matches it.
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - name: Install
        working-directory: mobile
        run: npm ci --no-audit --no-fund
      - name: Release
        env:
          PLATFORM: ${{ inputs.platform || 'all' }}
          FORCE_BUILD: ${{ inputs.force_build && 'true' || 'false' }}
          DRY_RUN: ${{ inputs.dry_run && 'true' || 'false' }}
        run: |
          [ -n "$EXPO_TOKEN" ] || { echo "::error title=Mobile release::EXPO_TOKEN secret is not set (mobile/docs/OTA.md)"; exit 1; }
          scripts/ci/mobile-release.sh
